<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>{{ error_code }} — {{ app_cfg.app_name }}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename=app_cfg.favicon) }}" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      background: #0b0d12;
      color: #eef1f7;
      text-align: center;
    }
    .card { max-width: 460px; }
    .code {
      font-size: 62px;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      background: linear-gradient(120deg, #5b86ff, #4fd0ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    h1 { margin: 14px 0 8px; font-size: 20px; font-weight: 700; }
    p { margin: 0 0 22px; color: #a7aebd; font-size: 14.5px; line-height: 1.6; }
    .links { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    a {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 600;
      text-decoration: none;
      color: #fff;
      background: #5b86ff;
      transition: background 0.18s ease;
    }
    a:hover { background: #3d6df2; }
    a.ghost {
      background: transparent;
      color: #a7aebd;
      border: 1px solid rgba(255, 255, 255, 0.16);
    }
    a.ghost:hover { background: rgba(255, 255, 255, 0.06); color: #eef1f7; }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">{{ error_code }}</div>
    <h1>{{ error_title }}</h1>
    <p>{{ error_message }}</p>
    <div class="links">
      <a href="/">Go home</a>
      <a class="ghost" href="/chat">Open chat</a>
    </div>
  </div>
</body>
</html>
