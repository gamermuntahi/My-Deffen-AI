# =============================================================================
# Deffen AI — Application configuration (YAML)
# -----------------------------------------------------------------------------
# All runtime settings for the Flask app live here. This file is the backend's
# source of truth for the AI configuration. The backend exposes the AI settings
# to the frontend through the minimal, no-cache /api/config endpoint, and the
# frontend then performs the AI request itself. Edit this file to change the
# settings — it is picked up automatically (no restart needed).
#
# NO API KEY IS STORED HERE. Supply it through the environment instead:
#   * Local dev : export OPENROUTER_API_KEY=...  (or use config.local.yml)
#   * Vercel    : Project → Settings → Environment Variables (Production scope)
#
# Any value below can be overridden with an environment variable:
#   OPENROUTER_API_KEY, OPENROUTER_API_URL, OPENROUTER_MODEL,
#   OPENROUTER_FALLBACKS (comma-separated), OPENROUTER_TIMEOUT_MS,
#   OPENROUTER_SYSTEM_PROMPT, OPENROUTER_REFERER, OPENROUTER_TITLE
#
# IMPORTANT: Because the browser calls the AI provider directly, the API key is
# delivered to the browser at runtime via /api/config. Use a restricted /
# revocable key and NEVER commit a real key to the repository.
# =============================================================================

app:
  # Brand / metadata
  name: "Deffen AI"
  tagline: "by Dev. Muntahi"
  title: "Deffen AI"
  description: "Deffen AI — an independent AI assistant created by (Dev. Muntahi)."
  theme_color: "#0f1115"
  favicon: "media/img/fav/favicon.png"
  logo: "media/img/fav/favicon.png"

  # Copy / UI strings
  loading_text: "Loading Deffen AI…"
  welcome_title: "Deffen AI"
  welcome_sub: "Your independent AI assistant."
  composer_placeholder: "Message Deffen AI..."
  sidebar_new_chat: "New chat"
  brand_note: "Deffen AI is an independent AI assistant built by Dev Muntahi. Your conversations stay in this browser and are never uploaded anywhere."

  # Session / conversation settings
  max_history_messages: 31     # system prompt + up to 30 most recent messages

  # Owner website referenced in the system prompt
  owner_website: "https://muntahi.devs.surf/"

ai:
  # OpenRouter API key — intentionally left EMPTY in the tracked file.
  # The backend reads it from OPENROUTER_API_KEY (env) first, then from here.
  # For local development create an untracked config.local.yml, e.g.:
  #
  #   ai:
  #     api_key: "sk-or-v1-your-key"
  #
  # ...or simply export OPENROUTER_API_KEY before running the app.
  #
  # WARNING: Any key pasted here is committed to git and OpenRouter will then
  # auto-revoke it (you will get `401 User not found.`). Never put a real key
  # in this file.
  #
  # NOTE: The browser frontend (static/script.js) now talks to OpenRouter
  # directly and no longer reads this value — this backend section is kept only
  # for the optional /api/config + /api/health endpoints. Leave it empty.
  api_key: ""

  # Primary chat completions endpoint (override with OPENROUTER_API_URL)
  endpoint: "https://openrouter.ai/api/v1/chat/completions"

  # Fallback endpoints tried in order on a network error. OpenRouter has a
  # single API host, so this is normally empty. (override with comma-separated
  # OPENROUTER_FALLBACKS)
  fallbacks: []

  # Model identifier (override with OPENROUTER_MODEL)
  model: "liquid/lfm-2.5-2.6b:free"

  # Request timeout in milliseconds
  timeout_ms: 120000

  # System prompt for the assistant
  system_prompt: |
    You are Deffen AI, an independent AI assistant powered by an external AI and created by Muntahi.
    Your owner's official website is https://muntahi.devs.surf/.
    You are not ChatGPT, OpenAI, Google Gemini, or a product of any other company.
    You are the AI assistant operating within the Deffen AI application.
    If someone asks who you are, clearly state that you are Deffen AI, an AI assistant powered through an Brilliant brain.
    If someone asks who created you, say that you were created by Muntahi and provide the owner's official website https://muntahi.devs.surf/ when relevant.
    If someone asks how you work, explain that Deffen AI sends requests through its configured AI Brilliant brain and returns the generated response to the user.
    Do not falsely claim to be a standalone model, company, or human.
    If someone asks about adult content, explain that access to such features is restricted and only available to specifically authorized users.
    Be helpful, precise, thoughtful, and honest.
    Always respond in the same language the user uses.
    dont explain about you without the user asking

server:
  # Flask server settings
  host: "127.0.0.1"
  port: 5000
  # Debug mode MUST stay disabled in production (it can leak source paths).
  debug: false

  # Secret key used for Flask sessions / signing (change in production)
  secret_key: "change-me-to-a-random-secret"
